version: "3.9"

services:

  # ── NGINX (Reverse Proxy + Frontend) ─────────────────────────────────────────
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: myfoodmylife-frontend
    container_name: myfoodmylife-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ── BACKEND (Node.js / Express API) ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: myfoodmylife-backend
    container_name: myfoodmylife-backend
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/myfoodmylife
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MONGODB (Database) ────────────────────────────────────────────────────────
  mongo:
    image: mongo:6.0
    container_name: myfoodmylife-mongo
    ports:
      - "27017:27017"          # Expose only if you need local DB access
    volumes:
      - mongo-data:/data/db   # Persist data across restarts
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

# ── VOLUMES ───────────────────────────────────────────────────────────────────
volumes:
  mongo-data:
    driver: local

# ── NETWORKS ──────────────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge