services:
  nginx:
    image: ramsrikanthp/myfoodmylife-frontend:latest
    # ← remove the build: block entirely
    container_name: myfoodmylife-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  backend:
    image: ramsrikanthp/myfoodmylife-backend:latest
    # ← remove the build: block entirely
    container_name: myfoodmylife-backend
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongo:27017/myfoodmylife
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:6.0
    container_name: myfoodmylife-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge